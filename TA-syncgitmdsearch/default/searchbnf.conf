[syncgitmdsearch-command]
syntax = syncgitmdsearch (dry_run=<bool>)? (overwrite=<bool>)? (branch=<string>)? (md_glob=<string>)? (target_app=<string>)?
shortdesc = Git上の Markdown から SPL を抽出し saved search として保存する
description = 設定済み Git リポジトリから .md を取得し、規約に従って SPL を抽出して saved search を作成または更新します。検索名はファイル名から .md を除いた値です。
usage = generating
appears-in = 10
maintainer = TA-syncgitmdsearch
example1 = | syncgitmdsearch
comment1 = Git の Markdown から saved search を同期する
example2 = | syncgitmdsearch dry_run=true
comment2 = 保存せず抽出結果だけ確認する
example3 = | syncgitmdsearch overwrite=true
comment3 = 既存 saved search も上書きして同期する
